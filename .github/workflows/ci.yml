name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `next build` generates .next/types/ (Next.js 16 typed-routes helpers,
      # e.g. PageProps<'/route'>) — tsc --noEmit must run after, not before,
      # or it fails on a clean checkout with no prior local `next dev`/`build`.
      - name: Build
        run: npx next build

      - name: Type-check
        run: npx tsc --noEmit

      - name: Route-protection check
        run: node scripts/check-route-protection.mjs
