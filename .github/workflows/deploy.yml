name: Test & Audit

# Vercel's own native GitHub git integration handles all actual deploys
# (preview on PRs, production on push to main) independently of this
# workflow -- confirmed directly: when this workflow's own CLI-driven
# `vercel deploy` step failed on a Vercel free-tier upload-API quota
# ("Too many requests... code: api-upload-free"), the site was still
# fully live and current, because Vercel's git integration had already
# deployed the same commit through a separate path that doesn't share
# that quota. Running `vercel build && vercel deploy --prebuilt` here
# was a fully redundant second deployment of the same commit, so it's
# been removed. This workflow's real job is the quality gate: tests +
# audit must pass before a PR can merge (required status checks),
# which is what actually keeps bad code out of what Vercel deploys.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ── PR gate ─────────────────────────────────────────────────────────────
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Dependency vulnerability audit (advisory, non-blocking)
        run: |
          npm audit --audit-level=high || echo "::warning::npm audit found high/critical vulnerabilities, review before the next dependency bump. Not blocking this deploy since a newly-disclosed transitive-dependency CVE with no code changes shouldn't lock out an unrelated urgent fix."
        continue-on-error: true

  # ── Push-to-main gate ───────────────────────────────────────────────────
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Dependency vulnerability audit (advisory, non-blocking)
        run: |
          npm audit --audit-level=high || echo "::warning::npm audit found high/critical vulnerabilities, review before the next dependency bump. Not blocking this deploy since a newly-disclosed transitive-dependency CVE with no code changes shouldn't lock out an unrelated urgent fix."
        continue-on-error: true
