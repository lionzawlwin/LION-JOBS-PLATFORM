name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ── Preview deploy (every PR) ──────────────────────────────────────────────
  deploy-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Dependency vulnerability audit (advisory, non-blocking)
        run: |
          npm audit --audit-level=high || echo "::warning::npm audit found high/critical vulnerabilities, review before the next dependency bump. Not blocking this deploy since a newly-disclosed transitive-dependency CVE with no code changes shouldn't lock out an unrelated urgent fix."
        continue-on-error: true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify secrets are present
        run: |
          [ -n "$VERCEL_TOKEN" ]      || { echo "::error::VERCEL_TOKEN secret is empty"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ]     || { echo "::error::VERCEL_ORG_ID secret is empty"; exit 1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::VERCEL_PROJECT_ID secret is empty"; exit 1; }
          echo "All three Vercel secrets are present."

      - name: Verify Vercel auth (token smoke-test)
        run: vercel whoami --token="$VERCEL_TOKEN"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### Preview Deployment',
                '',
                `**URL:** ${{ steps.deploy.outputs.url }}`,
                '',
                '_Deployed from commit `${{ github.sha }}`_',
              ].join('\n'),
            })

  # ── Production deploy (push to main) ──────────────────────────────────────
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Dependency vulnerability audit (advisory, non-blocking)
        run: |
          npm audit --audit-level=high || echo "::warning::npm audit found high/critical vulnerabilities, review before the next dependency bump. Not blocking this deploy since a newly-disclosed transitive-dependency CVE with no code changes shouldn't lock out an unrelated urgent fix."
        continue-on-error: true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Verify secrets are present
        run: |
          [ -n "$VERCEL_TOKEN" ]      || { echo "::error::VERCEL_TOKEN secret is empty"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ]     || { echo "::error::VERCEL_ORG_ID secret is empty"; exit 1; }
          [ -n "$VERCEL_PROJECT_ID" ] || { echo "::error::VERCEL_PROJECT_ID secret is empty"; exit 1; }
          echo "All three Vercel secrets are present."

      - name: Verify Vercel auth (token smoke-test)
        run: vercel whoami --token="$VERCEL_TOKEN"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
