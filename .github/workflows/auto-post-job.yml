name: Auto Post Job to Telegram & Facebook

# Triggered by Vercel webhook via repository_dispatch
on:
  repository_dispatch:
    types: [new-job-posted]

jobs:
  post-job:
    name: Generate Image & Distribute
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Check out repo so we can run scripts/main.py ──────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install system fonts (needed by Pillow for text rendering)
      - name: Install system fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk

      # ── 3. Set up Python ─────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      # ── 4. Install Python dependencies ───────────────────────────
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── 5. Run the posting script ─────────────────────────────────
      # All secrets are injected as environment variables.
      # The job payload forwarded by Vercel is available as
      # github.event.client_payload and passed via JOB_DATA.
      - name: Generate image and post to channels
        env:
          JOB_DATA: ${{ toJson(github.event.client_payload) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          LOGO_URL: ${{ secrets.LOGO_URL }}
        run: python scripts/main.py
